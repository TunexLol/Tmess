<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TMessenger</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      padding: 16px; margin: 0; font-size: 16px;
      border-bottom: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center;
    }
    .badge {
      background: #ef4444; color: white; font-size: 11px;
      padding: 2px 8px; border-radius: 10px; font-weight: 600;
    }

    .me {
      padding: 12px 16px; font-size: 13px; color: #94a3b8;
      border-bottom: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .me-info { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
    .me-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me a { color: #f87171; text-decoration: none; cursor: pointer; flex-shrink: 0; font-size: 12px; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #334155; display: flex; align-items: center; justify-content: center;
      font-weight: 600; color: #94a3b8; flex-shrink: 0;
      overflow: hidden; font-size: 14px;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.lg { width: 80px; height: 80px; font-size: 32px; }

    .search { padding: 12px; border-bottom: 1px solid #334155; }
    .search input {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    }

    .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .section-title {
      padding: 8px 16px; font-size: 11px; text-transform: uppercase;
      color: #64748b; letter-spacing: 0.5px;
      background: #0f172a;
    }

    .item {
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; gap: 10px;
    }
    .item:hover { background: #334155; }
    .item.active { background: #334155; }
    .item .info { min-width: 0; flex: 1; }
    .item .name {
      font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .item.global .name::before { content: '🌐 '; }

    /* Кнопки действий в поиске */
    .action-btn {
      padding: 6px 12px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    }
    .action-add { background: #3b82f6; color: white; }
    .action-pending { background: #475569; color: #cbd5e1; cursor: default; }
    .action-accept { background: #22c55e; color: white; }
    .action-reject { background: #334155; color: #e2e8f0; }
    .action-write { background: #334155; color: #e2e8f0; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header {
      padding: 12px 16px; border-bottom: 1px solid #334155;
      font-weight: 600; display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .back {
      display: none; background: none; border: none;
      color: #60a5fa; font-size: 22px; cursor: pointer;
      padding: 0 6px 0 0; line-height: 1;
    }
    .messages {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px;
    }
    .msg { margin-bottom: 12px; max-width: 75%; display: flex; gap: 8px; }
    .msg .body { min-width: 0; }
    .msg .who { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .msg .bubble {
      background: #334155; padding: 8px 12px;
      border-radius: 12px; word-wrap: break-word;
    }
    .msg.own { margin-left: auto; flex-direction: row-reverse; }
    .msg.own .bubble { background: #3b82f6; }
    .msg.own .who { text-align: right; }

    .composer {
      padding: 12px; border-top: 1px solid #334155;
      display: flex; gap: 8px; flex-shrink: 0;
    }
    .composer input {
      flex: 1; padding: 10px; border-radius: 6px;
      border: 1px solid #334155; background: #0f172a;
      color: #e2e8f0; min-width: 0;
    }
    .composer button {
      padding: 10px 20px; border: none; border-radius: 6px;
      background: #3b82f6; color: white; font-weight: 600; cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: default; }
    .empty { padding: 32px; text-align: center; color: #64748b; }

    /* Модальное окно профиля */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #1e293b; border-radius: 12px; padding: 24px;
      width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin: 0 0 20px; font-size: 18px; }
    .modal label { display: block; font-size: 13px; margin: 12px 0 4px; color: #94a3b8; }
    .modal input[type=text] {
      width: 100%; padding: 10px; border-radius: 6px;
      border: 1px solid #334155; background: #0f172a;
      color: #e2e8f0; font-size: 15px;
    }
    .modal input:disabled { background: #0f172a; color: #64748b; cursor: not-allowed; }
    .avatar-block {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; margin-bottom: 8px;
    }
    .avatar-edit-btn {
      padding: 8px 16px; background: #334155; color: #e2e8f0;
      border-radius: 6px; cursor: pointer; font-size: 13px; border: none;
    }
    .avatar-edit-btn:hover { background: #475569; }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
    .modal-actions button {
      flex: 1; padding: 12px; border-radius: 6px; border: none;
      font-weight: 600; cursor: pointer; font-size: 15px;
    }
    .btn-save { background: #3b82f6; color: white; }
    .btn-save:hover { background: #2563eb; }
    .btn-cancel { background: #334155; color: #e2e8f0; }
    .btn-cancel:hover { background: #475569; }
    .modal-msg { margin-top: 12px; font-size: 13px; }
    .modal-msg.err { color: #f87171; }
    .modal-msg.ok { color: #4ade80; }

    @media (max-width: 640px) {
      .sidebar { width: 100%; }
      .main { display: none; }
      body.show-chat .sidebar { display: none; }
      body.show-chat .main { display: flex; }
      .back { display: inline-block; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>
      <span>TMessenger</span>
      <span id="requests-badge" class="badge" style="display:none">0</span>
    </h2>
    <div class="me">
      <div class="me-info" onclick="openProfile()">
        <div class="avatar" id="me-avatar"></div>
        <span id="me-info">Загрузка...</span>
      </div>
      <a onclick="logout()">Выйти</a>
    </div>
    <div class="search">
      <input id="search" placeholder="Поиск по юзеру...">
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="main">
    <div class="header">
      <button class="back" onclick="closeChat()">←</button>
      <span id="chat-header">Выберите чат</span>
    </div>
    <div class="messages" id="messages">
      <div class="empty">Выберите собеседника или группу «Все люди»</div>
    </div>
    <div class="composer">
      <input id="input" placeholder="Сообщение..." disabled>
      <button onclick="send()" disabled id="send-btn">→</button>
    </div>
  </div>

  <!-- Модальное окно профиля -->
  <div class="modal-bg" id="profile-modal">
    <div class="modal">
      <h3>Профиль</h3>
      <div class="avatar-block">
        <div class="avatar lg" id="profile-avatar"></div>
        <label for="avatar-file" class="avatar-edit-btn">Изменить фото</label>
        <input type="file" id="avatar-file" accept="image/*"
               style="display:none" onchange="uploadAvatar(this)">
      </div>
      <label>Ник (отображаемое имя)</label>
      <input type="text" id="profile-nickname" placeholder="Ваш ник">
      <label>Юзер (нельзя изменить)</label>
      <input type="text" id="profile-username" disabled>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeProfile()">Отмена</button>
        <button class="btn-save" onclick="saveProfile()">Сохранить</button>
      </div>
      <div class="modal-msg" id="profile-msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
  <script src="app.js"></script>
  <script>
    let me = null;
    let globalGroupId = null;
    let currentChat = null;
    let channelMessages = null;
    let channelRequests = null;
    let friends = [];           // массив id друзей
    let outgoingRequests = [];  // id, кому я отправил
    let incomingRequests = [];  // заявки мне

    // ---------- Утилиты ----------
    function initials(name) {
      if (!name) return '?';
      return name.trim().charAt(0).toUpperCase();
    }
    function setAvatar(el, url, name) {
      el.innerHTML = '';
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        el.appendChild(img);
      } else {
        el.textContent = initials(name);
      }
    }

    // ---------- Инициализация ----------
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }

      const { data: profile, error } = await sb.from('profiles')
        .select('*').eq('id', session.user.id).single();

      if (error || !profile) {
        const meta = session.user.user_metadata || {};
        const { data: created } = await sb.from('profiles').insert({
          id: session.user.id,
          username: meta.username || session.user.email.split('@')[0],
          nickname: meta.nickname || meta.username || 'Пользователь'
        }).select().single();
        me = created;
      } else {
        me = profile;
      }

      renderMe();
      await ensureGlobalGroup();
      await loadFriendsData();
      await renderList();
      subscribeToMessages();
      subscribeToRequests();
    }

    function renderMe() {
      document.getElementById('me-info').textContent =
        me.nickname + ' (@' + me.username + ')';
      setAvatar(document.getElementById('me-avatar'), me.avatar_url, me.nickname);
    }

    async function ensureGlobalGroup() {
      let { data: g } = await sb.from('groups')
        .select('*').eq('name', 'Все люди').limit(1).maybeSingle();
      if (!g) {
        const { data: created } = await sb.from('groups')
          .insert({ name: 'Все люди', owner_id: me.id })
          .select().single();
        g = created;
      }
      if (!g) return;
      globalGroupId = g.id;
      await sb.from('group_members').upsert(
        { group_id: globalGroupId, user_id: me.id },
        { onConflict: 'group_id,user_id' }
      );
    }

    // ---------- Загрузка данных о друзьях ----------
    async function loadFriendsData() {
      const { data, error } = await sb.from('friend_requests')
        .select('*')
        .or(`from_user.eq.${me.id},to_user.eq.${me.id}`);

      if (error) {
        console.error('Ошибка загрузки заявок:', error);
        return;
      }

      friends = [];
      outgoingRequests = [];
      incomingRequests = [];

      (data || []).forEach(r => {
        if (r.status === 'accepted') {
          const friendId = r.from_user === me.id ? r.to_user : r.from_user;
          friends.push(friendId);
        } else if (r.status === 'pending') {
          if (r.from_user === me.id) outgoingRequests.push(r.to_user);
          else incomingRequests.push(r.from_user);
        }
      });

      // Обновляем бейдж с количеством входящих
      const badge = document.getElementById('requests-badge');
      if (incomingRequests.length > 0) {
        badge.textContent = incomingRequests.length;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }

    // ---------- Список чатов ----------
    let searchTimer = null;
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => renderList(e.target.value.trim()), 250);
    });

    async function renderList(searchQuery = '') {
      const list = document.getElementById('list');
      list.innerHTML = '';

      // Режим поиска
      if (searchQuery) {
        list.innerHTML = '<div class="section-title">Результаты поиска</div>';
        const { data: users } = await sb.from('profiles').select('*')
          .neq('id', me.id)
          .ilike('username', `%${searchQuery}%`)
          .limit(30);

        if (!users || users.length === 0) {
          list.innerHTML += '<div class="empty">Никого не найдено</div>';
          return;
        }

        users.forEach(u => {
          const el = document.createElement('div');
          el.className = 'item';

          const av = document.createElement('div');
          av.className = 'avatar';
          setAvatar(av, u.avatar_url, u.nickname);

          const info = document.createElement('div');
          info.className = 'info';
          const nameEl = document.createElement('div');
          nameEl.className = 'name';
          nameEl.textContent = u.nickname;
          const subEl = document.createElement('div');
          subEl.className = 'sub';
          subEl.textContent = '@' + u.username;
          info.appendChild(nameEl);
          info.appendChild(subEl);

          el.appendChild(av);
          el.appendChild(info);
          el.appendChild(makeActionButton(u));
          list.appendChild(el);
        });
        return;
      }

      // Входящие заявки
      if (incomingRequests.length > 0) {
        list.innerHTML += '<div class="section-title">Заявки в друзья</div>';
        const { data: requesters } = await sb.from('profiles').select('*')
          .in('id', incomingRequests);

        (requesters || []).forEach(u => {
          const el = document.createElement('div');
          el.className = 'item';

          const av = document.createElement('div');
          av.className = 'avatar';
          setAvatar(av, u.avatar_url, u.nickname);

          const info = document.createElement('div');
          info.className = 'info';
          const nameEl = document.createElement('div');
          nameEl.className = 'name';
          nameEl.textContent = u.nickname;
          const subEl = document.createElement('div');
          subEl.className = 'sub';
          subEl.textContent = '@' + u.username;
          info.appendChild(nameEl);
          info.appendChild(subEl);

          const actions = document.createElement('div');
          actions.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';
          const acceptBtn = document.createElement('button');
          acceptBtn.className = 'action-btn action-accept';
          acceptBtn.textContent = '✓';
          acceptBtn.title = 'Принять';
          acceptBtn.onclick = (e) => { e.stopPropagation(); acceptRequest(u.id); };
          const rejectBtn = document.createElement('button');
          rejectBtn.className = 'action-btn action-reject';
          rejectBtn.textContent = '✕';
          rejectBtn.title = 'Отклонить';
          rejectBtn.onclick = (e) => { e.stopPropagation(); rejectRequest(u.id); };
          actions.appendChild(acceptBtn);
          actions.appendChild(rejectBtn);

          el.appendChild(av);
          el.appendChild(info);
          el.appendChild(actions);
          list.appendChild(el);
        });
      }

      // Общий чат
      list.innerHTML += '<div class="section-title">Чаты</div>';
      const g = document.createElement('div');
      g.className = 'item global';
      if (currentChat?.type === 'group' && currentChat.id === globalGroupId) {
        g.classList.add('active');
      }
      g.innerHTML = `<div class="info"><div class="name">Все люди</div>
        <div class="sub">Общий чат</div></div>`;
      g.onclick = () => openGroup(globalGroupId, 'Все люди');
      list.appendChild(g);

      // Друзья
      if (friends.length > 0) {
        const { data: friendProfiles } = await sb.from('profiles').select('*')
          .in('id', friends);

        (friendProfiles || []).forEach(u => {
          const el = document.createElement('div');
          el.className = 'item';
          if (currentChat?.type === 'user' && currentChat.id === u.id) {
            el.classList.add('active');
          }

          const av = document.createElement('div');
          av.className = 'avatar';
          setAvatar(av, u.avatar_url, u.nickname);

          const info = document.createElement('div');
          info.className = 'info';
          const nameEl = document.createElement('div');
          nameEl.className = 'name';
          nameEl.textContent = u.nickname;
          const subEl = document.createElement('div');
          subEl.className = 'sub';
          subEl.textContent = '@' + u.username;
          info.appendChild(nameEl);
          info.appendChild(subEl);

          el.appendChild(av);
          el.appendChild(info);
          el.onclick = () => openUser(u);
          list.appendChild(el);
        });
      } else {
        const hint = document.createElement('div');
        hint.style.cssText = 'padding:16px;color:#64748b;font-size:13px;text-align:center;';
        hint.textContent = 'Найдите друга по юзеру, чтобы начать переписку';
        list.appendChild(hint);
      }
    }

    function makeActionButton(u) {
      const btn = document.createElement('button');
      btn.className = 'action-btn';

      if (friends.includes(u.id)) {
        btn.className += ' action-write';
        btn.textContent = 'Написать';
        btn.onclick = (e) => { e.stopPropagation(); openUser(u); };
      } else if (outgoingRequests.includes(u.id)) {
        btn.className += ' action-pending';
        btn.textContent = 'Отправлено';
        btn.disabled = true;
      } else if (incomingRequests.includes(u.id)) {
        btn.className += ' action-accept';
        btn.textContent = 'Принять';
        btn.onclick = (e) => { e.stopPropagation(); acceptRequest(u.id); };
      } else {
        btn.className += ' action-add';
        btn.textContent = 'В друзья';
        btn.onclick = (e) => { e.stopPropagation(); sendFriendRequest(u.id); };
      }
      return btn;
    }

    // ---------- Действия с заявками ----------
    async function sendFriendRequest(userId) {
      const { error } = await sb.from('friend_requests')
        .insert({ from_user: me.id, to_user: userId });
      if (error) { alert('Ошибка: ' + error.message); return; }
      await loadFriendsData();
      await renderList(document.getElementById('search').value.trim());
    }

    async function acceptRequest(userId) {
      const { error } = await sb.from('friend_requests')
        .update({ status: 'accepted', updated_at: new Date().toISOString() })
        .eq('from_user', userId).eq('to_user', me.id).eq('status', 'pending');
      if (error) { alert('Ошибка: ' + error.message); return; }
      await loadFriendsData();
      await renderList(document.getElementById('search').value.trim());
    }

    async function rejectRequest(userId) {
      const { error } = await sb.from('friend_requests')
        .delete()
        .eq('from_user', userId).eq('to_user', me.id).eq('status', 'pending');
      if (error) { alert('Ошибка: ' + error.message); return; }
      await loadFriendsData();
      await renderList(document.getElementById('search').value.trim());
    }

    // ---------- Открытие чатов ----------
    function openGroup(id, name) {
      currentChat = { type: 'group', id, name };
      document.getElementById('chat-header').textContent = '🌐 ' + name;
      enableComposer();
      loadMessages();
      document.body.classList.add('show-chat');
      renderList(document.getElementById('search').value.trim());
    }

    function openUser(u) {
      currentChat = { type: 'user', id: u.id, name: u.nickname };
      document.getElementById('chat-header').textContent =
        u.nickname + ' (@' + u.username + ')';
      enableComposer();
      loadMessages();
      document.body.classList.add('show-chat');
      renderList(document.getElementById('search').value.trim());
    }

    function closeChat() {
      document.body.classList.remove('show-chat');
    }

    function enableComposer() {
      document.getElementById('input').disabled = false;
      document.getElementById('send-btn').disabled = false;
    }

    // ---------- Сообщения ----------
    async function loadMessages() {
      const box = document.getElementById('messages');
      box.innerHTML = '<div class="empty">Загрузка...</div>';

      let q = sb.from('messages').select('*')
        .order('created_at', { ascending: true }).limit(200);

      if (currentChat.type === 'group') {
        q = q.eq('group_id', currentChat.id);
      } else {
        q = q.or(
          `and(sender_id.eq.${me.id},receiver_id.eq.${currentChat.id}),` +
          `and(sender_id.eq.${currentChat.id},receiver_id.eq.${me.id})`
        );
      }

      const { data, error } = await q;
      box.innerHTML = '';

      if (error) {
        box.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>';
        return;
      }
      if (!data || data.length === 0) {
        box.innerHTML = '<div class="empty">Сообщений пока нет</div>';
        return;
      }

      await fillSenders(data);
      data.forEach(m => appendMessage(m));
      box.scrollTop = box.scrollHeight;
    }

    async function fillSenders(msgs) {
      const ids = [...new Set(msgs.map(m => m.sender_id))];
      if (!ids.length) return;
      const { data, error } = await sb.from('profiles')
        .select('id,nickname,username,avatar_url').in('id', ids);
      if (error) return;
      const map = {};
      (data || []).forEach(p => { map[p.id] = p; });
      msgs.forEach(m => {
        const p = map[m.sender_id];
        m._nickname = p ? p.nickname : 'Неизвестный';
        m._username = p ? p.username : '';
        m._avatar = p ? p.avatar_url : null;
      });
    }

    function appendMessage(m) {
      const box = document.getElementById('messages');
      const empty = box.querySelector('.empty');
      if (empty) empty.remove();

      const own = m.sender_id === me.id;
      const div = document.createElement('div');
      div.className = 'msg' + (own ? ' own' : '');

      const av = document.createElement('div');
      av.className = 'avatar';
      setAvatar(av, own ? me.avatar_url : m._avatar,
                       own ? me.nickname : m._nickname);

      const body = document.createElement('div');
      body.className = 'body';

      const who = document.createElement('div');
      who.className = 'who';
      if (own) who.textContent = 'Вы';
      else {
        const nick = m._nickname || 'Неизвестный';
        const uname = m._username ? ' @' + m._username : '';
        who.textContent = nick + uname;
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.content;

      body.appendChild(who);
      body.appendChild(bubble);
      div.appendChild(av);
      div.appendChild(body);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // ---------- Отправка ----------
    async function send() {
      const input = document.getElementById('input');
      const content = input.value.trim();
      if (!content || !currentChat) return;
      input.value = '';

      const row = { sender_id: me.id, content };
      if (currentChat.type === 'group') row.group_id = currentChat.id;
      else row.receiver_id = currentChat.id;

      const { error } = await sb.from('messages').insert(row);
      if (error) { alert('Ошибка отправки: ' + error.message); return; }

      appendMessage({ ...row, _nickname: me.nickname,
                      _username: me.username, _avatar: me.avatar_url });
    }

    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') send();
    });

    // ---------- Realtime: сообщения ----------
    function subscribeToMessages() {
      channelMessages = sb.channel('messages-rt')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages' },
          async (payload) => {
            const m = payload.new;
            if (!currentChat) return;
            const relevant =
              (currentChat.type === 'group' && m.group_id === currentChat.id) ||
              (currentChat.type === 'user' && (
                (m.sender_id === me.id && m.receiver_id === currentChat.id) ||
                (m.sender_id === currentChat.id && m.receiver_id === me.id)
              ));
            if (!relevant) return;
            if (m.sender_id === me.id) return;
            await fillSenders([m]);
            appendMessage(m);
          })
        .subscribe();
    }

    // ---------- Realtime: заявки ----------
    function subscribeToRequests() {
      channelRequests = sb.channel('requests-rt')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'friend_requests' },
          async () => {
            await loadFriendsData();
            await renderList(document.getElementById('search').value.trim());
          })
        .subscribe();
    }

    // ---------- Профиль ----------
    function openProfile() {
      document.getElementById('profile-nickname').value = me.nickname;
      document.getElementById('profile-username').value = me.username;
      setAvatar(document.getElementById('profile-avatar'), me.avatar_url, me.nickname);
      document.getElementById('profile-msg').textContent = '';
      document.getElementById('profile-modal').classList.add('open');
    }

    function closeProfile() {
      document.getElementById('profile-modal').classList.remove('open');
    }

    async function saveProfile() {
      const nick = document.getElementById('profile-nickname').value.trim();
      const msg = document.getElementById('profile-msg');
      msg.className = 'modal-msg'; msg.textContent = '';

      if (!nick) {
        msg.textContent = 'Ник не может быть пустым';
        msg.className = 'modal-msg err';
        return;
      }

      msg.textContent = 'Сохраняем...';
      const { error } = await sb.from('profiles')
        .update({ nickname: nick }).eq('id', me.id);

      if (error) {
        msg.textContent = 'Ошибка: ' + error.message;
        msg.className = 'modal-msg err';
        return;
      }

      me.nickname = nick;
      renderMe();
      await renderList(document.getElementById('search').value.trim());
      msg.textContent = 'Сохранено!';
      msg.className = 'modal-msg ok';
      setTimeout(closeProfile, 800);
    }

    async function uploadAvatar(input) {
      const file = input.files[0];
      if (!file) return;
      const msg = document.getElementById('profile-msg');
      msg.className = 'modal-msg'; msg.textContent = 'Загружаем фото...';

      if (file.size > 2 * 1024 * 1024) {
        msg.textContent = 'Фото больше 2 МБ';
        msg.className = 'modal-msg err'; return;
      }

      const ext = file.name.split('.').pop() || 'jpg';
      const path = me.id + '/avatar.' + ext;

      const { error: upErr } = await sb.storage
        .from('avatars').upload(path, file, { upsert: true, contentType: file.type });

      if (upErr) {
        msg.textContent = 'Ошибка загрузки: ' + upErr.message;
        msg.className = 'modal-msg err'; return;
      }

      const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
      const url = urlData.publicUrl + '?t=' + Date.now();

      const { error: dbErr } = await sb.from('profiles')
        .update({ avatar_url: url }).eq('id', me.id);

      if (dbErr) {
        msg.textContent = 'Ошибка сохранения: ' + dbErr.message;
        msg.className = 'modal-msg err'; return;
      }

      me.avatar_url = url;
      setAvatar(document.getElementById('profile-avatar'), url, me.nickname);
      renderMe();
      await renderList(document.getElementById('search').value.trim());
      msg.textContent = 'Фото обновлено!';
      msg.className = 'modal-msg ok';
    }

    // ---------- Выход ----------
    function logout() {
      sb.auth.signOut().then(() => location.href = 'index.html');
    }

    // ---------- Фикс высоты под клавиатуру ----------
    if (window.visualViewport) {
      const setVH = () => {
        document.body.style.height = window.visualViewport.height + 'px';
      };
      window.visualViewport.addEventListener('resize', setVH);
      window.visualViewport.addEventListener('scroll', setVH);
      setVH();
    }

    init();
  </script>
</body>
  </html>
